<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="《彩虹六号：围攻》桌游视线测量工具"
    />
    <title>彩虹六号：围攻 — 视线测量工具</title>
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/standalone.css?v=20260903.3" />
    <script type="module" src="./scripts/app.js?v=20260903.6"></script>
  </head>
  <body>
    <div class="hidden-layout">
      <header class="hidden-header">
        <div class="header-logo">
          <div class="r6-logo" aria-hidden="true">6S</div>
          <h1>进阶工具</h1>
        </div>
        <div class="standalone-badge">视线工具 · 浏览器本地运算</div>
      </header>

      <nav class="hidden-nav" aria-label="工具导航">
        <ul>
          <li><a class="active-nav-link" href="./">视线测量</a></li>
        </ul>
      </nav>

      <main class="hidden-content">
        <section class="los-tool" aria-labelledby="page-title">
          <div class="tactical-header">
            <div class="tactical-header-title-wrapper">
              <h2 id="page-title" class="tactical-header-title">
                视线测量工具
              </h2>
            </div>
            <div class="tactical-header-decoration" aria-hidden="true">
              <div class="tactical-header-line"></div>
              <div class="tactical-header-dot"></div>
            </div>
          </div>

          <section class="tactical-panel tactical-panel-hex">
            <div class="tactical-panel-header">
              <h3 class="tactical-panel-title">选择地图</h3>
              <div class="los-map-selector">
                <label class="sr-only" for="map-select">地图</label>
                <select id="map-select" class="tactical-select"></select>
              </div>
            </div>

            <div class="tactical-panel-body los-calculator-embed">
              <div class="calculator-page">
                <div id="canvas-wrapper" class="canvas-wrapper">
                  <div class="zoom-controls" aria-label="地图缩放">
                    <button id="zoom-out" type="button" title="缩小地图">
                      <span aria-hidden="true">−</span>
                    </button>
                    <button id="zoom-reset" type="button" title="重置缩放">
                      100%
                    </button>
                    <button id="zoom-in" type="button" title="放大地图">
                      <span aria-hidden="true">+</span>
                    </button>
                  </div>
                  <div id="canvas-container" class="canvas-container">
                    <canvas
                      id="map-canvas"
                      width="800"
                      height="600"
                      aria-label="交互式地图：轻触放置，单指拖动平移，双指缩放"
                    ></canvas>
                    <div id="drag-tooltip" class="drag-tooltip visible"></div>
                  </div>
                </div>

                <p class="mobile-map-help">
                  单指拖动平移 · 双指缩放 · 轻触格子放置
                </p>

                <div class="player-spacer"></div>
                <div class="calculator-controls">
                  <div class="player-controls">
                    <div
                      id="los-result"
                      class="los-result"
                      role="status"
                      aria-live="polite"
                      aria-atomic="true"
                      hidden
                    >
                      <div id="los-result-icon" class="los-result-icon"></div>
                      <div>
                        <strong id="los-result-text"></strong>
                        <div id="los-result-reason" class="result-reason"></div>
                      </div>
                    </div>

                    <div class="controls-main">
                      <button id="place-blue" type="button" class="blue-button">
                        放置蓝方干员
                      </button>
                      <button id="place-orange" type="button" class="orange-button">
                        放置橙方干员
                      </button>
                    </div>

                    <div class="smoke-controls">
                      <h4>部署烟雾</h4>
                      <div class="smoke-patterns" aria-label="烟雾范围">
                        <button
                          type="button"
                          class="smoke-pattern"
                          data-smoke-width="2"
                          data-smoke-height="2"
                          title="2 × 2 烟雾"
                        >
                          <span class="smoke-preview smoke-preview-2x2" aria-hidden="true">
                            <i></i><i></i><i></i><i></i>
                          </span>
                          <span>2 × 2</span>
                        </button>
                        <button
                          type="button"
                          class="smoke-pattern"
                          data-smoke-width="2"
                          data-smoke-height="1"
                          title="2 × 1 烟雾"
                        >
                          <span class="smoke-preview smoke-preview-2x1" aria-hidden="true">
                            <i></i><i></i>
                          </span>
                          <span>2 × 1</span>
                        </button>
                        <button
                          type="button"
                          class="smoke-pattern"
                          data-smoke-width="1"
                          data-smoke-height="2"
                          title="1 × 2 烟雾"
                        >
                          <span class="smoke-preview smoke-preview-1x2" aria-hidden="true">
                            <i></i><i></i>
                          </span>
                          <span>1 × 2</span>
                        </button>
                      </div>
                      <p id="smoke-instructions" class="instructions" hidden></p>
                      <button id="clear-smokes" type="button" class="clear-smokes-button" hidden>
                        清除所有烟雾
                      </button>
                    </div>

                    <p class="auto-calculate-note">
                      棋盘发生变化后，视线结果会自动更新。
                    </p>

                    <div class="controls-main action-row reset-row">
                      <button id="reset-map" type="button" class="secondary-button">
                        重置地图
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

        </section>
      </main>

      <footer class="hidden-footer">
        <div class="footer-content">
          <div class="footer-logo">6S</div>
          <p>《彩虹六号：围攻》桌游 — 进阶工具</p>
        </div>
      </footer>
    </div>

    <div id="status-toast" class="status-toast" role="status" aria-live="polite"></div>
  </body>
</html>
