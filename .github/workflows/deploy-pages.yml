name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Run tests
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: rsync -a --exclude='site-dist/' --exclude='node_modules/' --exclude='.git/' --exclude='.github/' --exclude='.wrangler/' --exclude='.dev.vars*' --exclude='.env*' --exclude='cloud/' --exclude='tests/' ./ site-dist/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
