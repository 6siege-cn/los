<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="彩虹六号：围攻桌游棋钟，按双方干员数量分配每轮时间。" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <title>彩虹六号：围攻 — 棋钟</title>
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/standalone.css?v=20260907.2" />
    <link rel="stylesheet" href="../styles/chess-clock.css?v=20260914.2" />
    <script type="module" src="./app.js"></script>
  </head>
  <body class="clock-page">
    <div class="hidden-layout clock-layout">
      <nav class="hidden-nav" aria-label="工具导航">
        <ul>
          <li><a href="../index.html">视线测量</a></li>
          <li><a href="../operator-selection/index.html">干员选择</a></li>
          <li><a class="active-nav-link" aria-current="page" href="./index.html">棋钟</a></li>
        </ul>
      </nav>
      <main class="clock-main">
        <section class="clock-board" aria-label="双方棋钟">
          <button type="button" class="clock-side clock-attack" id="attack-clock" aria-label="进攻方棋钟：按下切换到防守方计时">
            <img class="team-emblem" src="../operator-selection/assets/icons/crossed-pickaxes.png" alt="" draggable="false" />
            <span class="clock-face"><span class="side-name">进攻方</span><span class="clock-time" id="attack-time" role="timer" aria-label="进攻方剩余时间">10:00</span><span class="side-state" id="attack-state">等待</span><span class="clock-hint">按下交给防守方</span></span>
          </button>
          <button type="button" class="clock-pause" id="pause-clock" aria-label="暂停双方计时" aria-pressed="true">
            <img src="../operator-selection/assets/icons/pause.svg" alt="" draggable="false" />
            <strong>暂停</strong><span id="clock-status" role="status">已暂停</span>
          </button>
          <button type="button" class="clock-side clock-defense" id="defense-clock" aria-label="防守方棋钟：按下切换到进攻方计时">
            <img class="team-emblem" src="../operator-selection/assets/icons/ribbon-badge.png" alt="" draggable="false" />
            <span class="clock-face"><span class="side-name">防守方</span><span class="clock-time" id="defense-time" role="timer" aria-label="防守方剩余时间">10:00</span><span class="side-state" id="defense-state">等待</span><span class="clock-hint">按下交给进攻方</span></span>
          </button>
        </section>
        <footer class="clock-settings" aria-label="棋钟配置">
          <label class="time-setting" for="seconds-per-operator"><img src="../operator-selection/assets/icons/stopwatch.png" alt="" /><span>每名干员</span><select id="seconds-per-operator"><option value="150">150 秒</option><option value="120" selected>120 秒</option><option value="90">90 秒</option><option value="60">60 秒</option></select></label>
          <div class="operator-count attack-count" role="group" aria-label="进攻方干员数量"><span>进攻</span><button type="button" data-side="attack" data-delta="-1" aria-label="进攻方减少一名干员">−</button><output id="attack-count" aria-live="polite">5</output><button type="button" data-side="attack" data-delta="1" aria-label="进攻方增加一名干员">+</button></div>
          <div class="operator-count defense-count" role="group" aria-label="防守方干员数量"><span>防守</span><button type="button" data-side="defense" data-delta="-1" aria-label="防守方减少一名干员">−</button><output id="defense-count" aria-live="polite">5</output><button type="button" data-side="defense" data-delta="1" aria-label="防守方增加一名干员">+</button></div>
          <button type="button" id="reset-round"><img src="../operator-selection/assets/icons/refresh-clockwise.png" alt="" />重置一轮</button>
          <p class="settings-note" id="settings-note">人数与档位在重置一轮后生效 · 按己方棋钟开始对方计时</p>
        </footer>
      </main>
    </div>
  </body>
</html>
